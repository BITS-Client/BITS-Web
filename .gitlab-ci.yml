# ================================
# BITS Corporate Website - GitLab CI/CD Pipeline
# ================================
# Quality gate pipeline: lint, typecheck, and security scanning.
# Deployment is handled externally by Cloudflare Pages Git Connection.
# ================================

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages:
  - security
  - test
  - install
  - validate

variables:
  PNPM_VERSION: '9'
  NODE_VERSION: '22'
  SAST_EXCLUDED_PATHS: 'node_modules, .pnpm-store, build, .svelte-kit'
  SECRET_DETECTION_EXCLUDED_PATHS: 'node_modules, .pnpm-store, build, .svelte-kit'

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"

cache: &global_cache
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

.node_setup: &node_setup
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm config set store-dir .pnpm-store --global

.default_rules: &default_rules
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^docs\// || $CI_COMMIT_MESSAGE =~ /\[docs only\]/
      when: never
    - changes:
        - '*.md'
        - 'docs/**/*'
        - '.vscode/**/*'
        - '.idea/**/*'
      when: never
    - when: on_success

# ================================
# Security Stage (from templates)
# ================================
# SAST and Secret Detection jobs run automatically from included templates

# ================================
# Install Stage
# ================================

install:
  stage: install
  image: node:${NODE_VERSION}-slim
  interruptible: true
  timeout: 10 minutes
  before_script: *node_setup
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  cache:
    <<: *global_cache
    policy: pull-push
  <<: *default_rules

# ================================
# Validate Stage
# ================================

validate:
  stage: validate
  image: node:${NODE_VERSION}-slim
  interruptible: true
  timeout: 10 minutes
  needs: ['install']
  dependencies:
    - install
  before_script: *node_setup
  script:
    - pnpm lint
    - pnpm check
  cache:
    <<: *global_cache
    policy: pull
  <<: *default_rules
