name: '🚀 Deploy'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/commit) to deploy'
        default: 'main'
        required: false

env:
  NODE_NO_WARNINGS: 1
  GIT_REF: ${{ inputs.ref || github.sha }}

concurrency:
  group: bits-web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-deploy:
    name: '☁️ Deploy to Cloudflare'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Public build config — needed by every step so `svelte-kit sync` can
      # generate $env/static/public types for the Typecheck step
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
      PUBLIC_SANITY_API_VERSION: ${{ vars.PUBLIC_SANITY_API_VERSION }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GIT_REF }}
          fetch-depth: 0

      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@v6

      - name: '🟢 Setup Node.js'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: '📚 Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '🔍 Typecheck'
        run: pnpm check

      - name: '🧹 Lint'
        run: pnpm lint

      - name: '🎨 Format check'
        run: pnpm format:check

      - name: '🏗️ Build'
        run: pnpm build

      - name: '🏗️ Ensure Pages project exists'
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🏗️ Ensuring Pages project bits-web exists..."
          npx wrangler pages project create bits-web --production-branch main || echo "ℹ️ Project already exists or create skipped"
          npx wrangler pages project list | head -n 20

      - name: '🔐 Set Cloudflare Pages Secrets (when deploy)'
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔐 Syncing Pages secrets to bits-web (set-when-deploy)..."
          printf "%s" "${{ secrets.TURNSTILE_SECRET_KEY }}" | npx wrangler pages secret put TURNSTILE_SECRET_KEY --project-name=bits-web || echo "⚠️ TURNSTILE_SECRET_KEY skip (project may not exist yet)"
          printf "%s" "${{ secrets.RESEND_API_KEY }}" | npx wrangler pages secret put RESEND_API_KEY --project-name=bits-web || echo "⚠️ RESEND_API_KEY skip"
          printf "%s" "${{ vars.PUBLIC_CONTACT_TO_EMAIL }}" | npx wrangler pages secret put PUBLIC_CONTACT_TO_EMAIL --project-name=bits-web || echo "⚠️ PUBLIC_CONTACT_TO_EMAIL skip"
          printf "%s" "${{ vars.PUBLIC_CONTACT_FROM_EMAIL }}" | npx wrangler pages secret put PUBLIC_CONTACT_FROM_EMAIL --project-name=bits-web || echo "⚠️ PUBLIC_CONTACT_FROM_EMAIL skip"
          echo "✅ Secrets sync done"

      - name: '🚀 Deploy to Cloudflare Pages'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=bits-web --branch=${{ github.ref_name }}

      - name: '🎉 Summary'
        if: success()
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::🚀 Deployed ${GIT_REF} to Cloudflare Pages (project=bits-web • https://bits.co.id)"
          fi
